name: QA generic reader direction (manual)
on:
  workflow_dispatch:
  push:
    branches: [engine-ai-layers]
    paths: ['shared/src/commonTest/kotlin/com/uaefinancial/tracker/intel/SmartDirectionReport.kt', '.github/workflows/qa-smart.yml']
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Report
        run: |
          chmod +x gradlew
          ./gradlew :shared:testDebugUnitTest --tests '*SmartDirectionReport*' --no-daemon -i 2>&1 | tee smart.log || true
          grep -h 'SMARTDIR' smart.log | sed 's/^ *//' | tee smartdir.txt
