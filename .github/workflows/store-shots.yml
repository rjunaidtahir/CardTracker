name: Store screenshots (raw)

# Debug build + demo data + emulator: captures the main screens in every theme. Raw images go to the `store-shots` branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 .github/scripts/shots.py
      - name: Publish
        if: always()
        run: |
          if [ -d raw ]; then
            git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
            mkdir -p /tmp/s && cp -r raw /tmp/s/
            git checkout --orphan store-shots && git rm -rf . >/dev/null 2>&1 || true
            cp -r /tmp/s/raw . && git add raw && git commit -qm "Raw store screens ${GITHUB_SHA::7}" && git push -f origin store-shots
          fi
