name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --continue 2>&1 | tee tests.log
          exit ${PIPESTATUS[0]}

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Android lint
        id: lint
        continue-on-error: true
        run: |
          ./gradlew lintDebug --no-daemon 2>&1 | tee lint.log
          exit ${PIPESTATUS[0]}

      - name: Report results
        if: always()
        run: python3 .github/scripts/report.py

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            *.log

      - name: Fail if tests or build failed
        if: steps.tests.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1

      - name: Publish APK as a release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk UAE-Financial-Tracker-v${VER}-build${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" UAE-Financial-Tracker-v${VER}-build${{ github.run_number }}.apk \
            --title "UAE Financial Tracker v${VER} (build ${{ github.run_number }})" \
            --notes "Built from commit ${{ github.sha }}. Tap the .apk below to download and install."
