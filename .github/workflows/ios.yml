name: iPhone app

# Runs only when the iPhone app or the shared engine changes (macOS minutes are expensive).
on:
  push:
    branches: ['**']
    paths:
      - 'ios/**'
      - 'shared/**'
      - '.github/workflows/ios.yml'
      - '.github/scripts/ios_report.py'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Shared engine tests on the iPhone simulator
        id: shared
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :shared:iosSimulatorArm64Test --no-daemon --continue 2>&1 | tee ios-shared.log
          exit ${PIPESTATUS[0]}

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build and test the iPhone app
        id: xcode
        continue-on-error: true
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=[(k,v) for k,v in d.items() if 'iOS' in k]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].split('iOS-')[-1].split('-')], reverse=True)
          for k,v in ios:
              for dev in v:
                  if dev['name'].startswith('iPhone'):
                      print(dev['udid']); sys.exit()
          ")
          echo "Simulator: $DEST"
          cd ios
          set +e
          xcodebuild test -project UAEFinancialTracker.xcodeproj -scheme UAEFinancialTracker \
            -destination "id=$DEST" CODE_SIGNING_ALLOWED=NO > ../xcode.log 2>&1
          rc=$?
          grep -E "error:|Test Case .* (passed|failed)|\*\* (BUILD|TEST)" ../xcode.log
          exit $rc

      - name: Build for a real iPhone (no signing)
        id: device
        if: steps.xcode.outcome == 'success'
        continue-on-error: true
        run: |
          cd ios
          set +e
          xcodebuild build -project UAEFinancialTracker.xcodeproj -scheme UAEFinancialTracker -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO > ../device.log 2>&1
          rc=$?
          grep -E "error:|\*\* BUILD" ../device.log
          exit $rc

      - name: Report results
        if: always()
        run: python3 .github/scripts/ios_report.py

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            *.log
            shared/build/reports/tests/

      - name: Fail if anything failed
        if: steps.shared.outcome != 'success' || steps.xcode.outcome != 'success' || steps.device.outcome == 'failure'
        run: exit 1
