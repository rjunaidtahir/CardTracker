name: iPhone app

# Runs only when the iPhone app or the shared engine changes (macOS minutes are expensive).
on:
  push:
    branches: ['**']
    paths:
      - 'ios/**'
      - 'shared/**'
      - '.github/workflows/ios.yml'
      - '.github/scripts/ios_report.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Shared engine tests on the iPhone simulator
        id: shared
        continue-on-error: true
        run: |
          chmod +x gradlew
          # Only when the shared engine changed (its tests also run on Android for every push).
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --name-only HEAD~1 HEAD | grep -q '^shared/'; then
            echo "Shared engine unchanged: skipped"; exit 0
          fi
          ./gradlew :shared:iosSimulatorArm64Test --no-daemon --continue 2>&1 | tee ios-shared.log
          exit ${PIPESTATUS[0]}

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build and test the iPhone app
        id: xcode
        continue-on-error: true
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=[(k,v) for k,v in d.items() if 'iOS' in k]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].split('iOS-')[-1].split('-')], reverse=True)
          for k,v in ios:
              for dev in v:
                  if dev['name'].startswith('iPhone'):
                      print(dev['udid']); sys.exit()
          ")
          echo "Simulator: $DEST"
          echo "$DEST" > sim.txt
          # Build like a Mac that has only Xcode (no Android SDK).
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          cd ios
          set +e
          xcodebuild test -project UAEFinancialTracker.xcodeproj -scheme UAEFinancialTracker \
            -destination "id=$DEST" -derivedDataPath ../dd CODE_SIGNING_ALLOWED=NO > ../xcode.log 2>&1
          rc=$?
          grep -E "error:|Test Case .* (passed|failed)|\*\* (BUILD|TEST)" ../xcode.log
          exit $rc

      - name: Build for a real iPhone (no signing)
        id: device
        if: steps.xcode.outcome == 'success'
        continue-on-error: true
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          cd ios
          set +e
          xcodebuild build -project UAEFinancialTracker.xcodeproj -scheme UAEFinancialTracker -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO > ../device.log 2>&1
          rc=$?
          grep -E "error:|\*\* BUILD" ../device.log
          exit $rc

      - name: Build with Xcode 16.2 (the newest Xcode for macOS Sonoma / Intel Macs)
        id: xcode162
        if: steps.xcode.outcome == 'success'
        continue-on-error: true
        run: |
          ls -d /Applications/Xcode_16.2*.app || { echo "::warning title=Xcode 16.2::Not on this runner"; exit 0; }
          export DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          rm -rf shared/build/xcode-frameworks shared/build/bin
          cd ios
          set +e
          build162() {
            xcodebuild build -project UAEFinancialTracker.xcodeproj -scheme UAEFinancialTracker -configuration Debug \
              -sdk iphoneos -arch arm64 -derivedDataPath ../dd162 CODE_SIGNING_ALLOWED=NO > ../xcode162.log 2>&1
          }
          # Xcode 16.2 needs its own iOS 18.2 platform (the runner only has newer ones); asset catalogs need it too.
          xcodebuild -downloadPlatform iOS -buildVersion 18.2 > ../download162.log 2>&1 || true
          echo "::notice title=Xcode 16.2 platform::$(tail -2 ../download162.log | tr '\n' ' ')"
          build162
          rc=$?
          if [ $rc -ne 0 ] && grep -q "Unable to find a destination\|is not installed" ../xcode162.log; then
            echo "Downloading the iOS platform for Xcode 16.2"
            xcodebuild -downloadPlatform iOS 2>&1 | tail -3
            build162
            rc=$?
          fi
          grep -E "error:|\*\* BUILD" ../xcode162.log | sed 's/^/[Xcode 16.2] /'
          exit $rc

      - name: Screenshots with sample data
        id: shots
        if: steps.xcode.outcome == 'success'
        continue-on-error: true
        run: |
          DEST=$(cat sim.txt)
          APP=dd/Build/Products/Debug-iphonesimulator/UAEFinancialTracker.app
          xcrun simctl boot "$DEST" 2>/dev/null || true
          xcrun simctl bootstatus "$DEST" -b > /dev/null
          xcrun simctl status_bar "$DEST" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$DEST" "$APP"
          mkdir -p shots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$DEST" com.uaefinancial.tracker 2>/dev/null || true
            xcrun simctl launch "$DEST" com.uaefinancial.tracker -demo YES "$@" > /dev/null
            sleep 7
            xcrun simctl io "$DEST" screenshot "shots/$name.png" > /dev/null
          }
          shot 01-home -tab home
          shot 02-activity -tab activity
          shot 03-cards -tab cards
          shot 04-more -tab more
          shot 05-card-detail -tab cards -screen card
          shot 06-fixed -tab home -screen fixed
          shot 07-review -tab home -screen review
          shot 08-automation -tab more -screen automation -sharedAutomation YES
          shot 08b-automation-older-ios -tab more -screen automation
          shot 09-statement -tab more -screen statement
          shot 10-notifications -tab more -screen notifications
          shot 11-welcome -onboarding YES
          shot 12-locked -locked YES
          xcrun simctl ui "$DEST" appearance dark
          shot 13-home-dark -tab home
          shot 14-cards-dark -tab cards
          ls -la shots

      - name: Publish screenshots (branch ios-screenshots)
        if: steps.shots.outcome == 'success'
        continue-on-error: true
        run: |
          cd shots
          git init -q
          git checkout -q -b ios-screenshots
          git add .
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "iPhone screenshots from ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-screenshots

      - name: Report results
        if: always()
        run: python3 .github/scripts/ios_report.py

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            *.log
            shared/build/reports/tests/

      - name: Fail if anything failed
        if: steps.shared.outcome != 'success' || steps.xcode.outcome != 'success' || steps.device.outcome == 'failure' || steps.xcode162.outcome == 'failure'
        run: exit 1
