name: iPhone app to TestFlight

# Run by hand (Actions → iPhone app to TestFlight → Run workflow) once the Apple Developer account exists and these
# repository secrets are set (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID            the 10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID               App Store Connect API key ID (App Store Connect → Users and Access → Integrations → Keys, role Admin)
#   ASC_ISSUER_ID            the Issuer ID shown on the same page
#   ASC_KEY_P8               the contents of the downloaded AuthKey_XXXX.p8 file
# Signing is automatic (Xcode's cloud signing), so no certificates or profiles need uploading.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Check the secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error title=Missing secrets::Add these repository secrets first:$missing"; exit 1; fi

      - name: Generate the Xcode project
        run: |
          chmod +x gradlew
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Archive and upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_$KEY.p8
          printf '%s' "$P8" > "$KEYFILE"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEYFILE -authenticationKeyID $KEY -authenticationKeyIssuerID $ISSUER"
          cd ios
          set +e
          xcodebuild archive -project UAEFinancialTracker.xcodeproj -scheme UAEFinancialTracker -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ../build/UAEFinancialTracker.xcarchive \
            DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} $AUTH > ../archive.log 2>&1
          rc=$?
          grep -E "error:|\*\* ARCHIVE" ../archive.log
          [ $rc -ne 0 ] && exit $rc
          cat > ../build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath ../build/UAEFinancialTracker.xcarchive -exportPath ../build/export \
            -exportOptionsPlist ../build/ExportOptions.plist $AUTH > ../export.log 2>&1
          rc=$?
          grep -E "error:|EXPORT|Upload" ../export.log
          exit $rc

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: '*.log'
