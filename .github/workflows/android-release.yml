name: Android app to Play Store

# Run by hand (Actions → Android app to Play Store → Run workflow) once the Play Console account exists
# and these repository secrets are set (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    `base64 -w0 fils-upload-key.jks` of the upload keystore
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_ALIAS          the key alias inside it (fils-upload)
#   ANDROID_KEY_PASSWORD       its key password (same as the store password for this keystore)
#
# Optional, to publish straight to Play Console instead of just producing a signed .aab:
#   PLAY_SERVICE_ACCOUNT_JSON  a Google Play service account key (Play Console → Users and permissions →
#                              Invite new user → grant "Release manager", then Google Cloud Console →
#                              create a JSON key for that service account) — contents of the .json file
#   PLAY_TRACK                 "internal", "alpha", "beta" or "production" (defaults to "internal")
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Console track to publish to (only used if PLAY_SERVICE_ACCOUNT_JSON is set)'
        required: false
        default: 'internal'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Check the signing secrets are set
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$SP" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error title=Missing secrets::Add these repository secrets first:$missing"; exit 1; fi

      - name: Decode the upload keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/fils-upload-key.jks"

      - name: Build the signed release bundle (.aab)
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/fils-upload-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Always-increasing, so each upload is accepted as a newer version by Play Console.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon

      - name: Keep the signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: fils-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Publish the signed bundle as a release
        # Workflow artifacts (the step above) expire and download via a storage host this repo's own
        # CI can reach fine, but some sandboxed tools can't follow. A release asset is a permanent,
        # directly downloadable link instead. Note: an .aab is a Play Store upload format, not an APK
        # — it can't be installed straight onto a phone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          cp "$AAB" "Fils-v${VER}-aab-release${{ github.run_number }}.aab"
          gh release create "aab-release-${{ github.run_number }}" "Fils-v${VER}-aab-release${{ github.run_number }}.aab" \
            --title "Fils v${VER} — signed .aab (release ${{ github.run_number }})" \
            --notes "Signed Android App Bundle, built from commit ${{ github.sha }} for Play Console upload. This is NOT an APK — it can't be installed on a phone directly; upload it as-is to Play Console."

      - name: Check for a Play Console service account
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "ready=${{ env.SA != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload to Play Console
        if: steps.play.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.uaefinancial.tracker
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
