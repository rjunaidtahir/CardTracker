name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run parser tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Keep test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Publish APK as a release (download it on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CardTracker-build${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" CardTracker-build${{ github.run_number }}.apk \
            --title "Card Tracker build ${{ github.run_number }}" \
            --notes "Debug build from commit ${{ github.sha }}. Tap the .apk below to download."
